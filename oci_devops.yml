version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm22-ee-java17
    TODO_PDB_NAME: ${TODO_PDB_NAME}
    REGION: ${REGION}
    UI_USERNAME: ${UI_USERNAME}
    DOCKER_USERNAME: ${DOCKER_USERNAME}
    DOCKER_PASSWORD: ${DOCKER_PASSWORD}
    DOCKER_REGISTRY: ${REGION}
    OCI_REGION: ${REGION}


  exportedVariables:
    - DOCKER_USERNAME
    - DOCKER_PASSWORD
    - TODO_PDB_NAME
    - REGION
    - UI_USERNAME
    - DOCKER_REGISTRY
    - OCI_REGION

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java17"
    command: yum -y install graalvm22-ee-17-native-image

  - type: Command
    name: "Set PATH Variable"
    command: export PATH=$JAVA_HOME/bin:$PATH

  - type: Command
    name: "Docker Login"
    command: |
      echo "x6Lx61Y(Md_uTTvO(kVa" | docker login -u "axixsctxuqtl/a01637441@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command
    name: "Build and Push Docker Image"
    command: |
      cd MtdrSpring/backend
      export DOCKER_REGISTRY=mx-queretaro-1.ocir.io
      export OCI_REGION=mx-queretaro-1
      # Install Node.js and npm
      curl -sL https://rpm.nodesource.com/setup_16.x | bash -
      yum install -y nodejs
      # Build the application
      mvn clean package spring-boot:repackage -DskipTests
      # Verify the JAR file exists
      ls -l target/MyTodoList-0.0.1-SNAPSHOT.jar
      # Build and push Docker image
      docker build -t ${DOCKER_REGISTRY}/todolistapp-springboot:0.1 .
      docker push ${DOCKER_REGISTRY}/todolistapp-springboot:0.1

  - type: Command
    name: "Deploy to Kubernetes"
    command: |
      cd MtdrSpring/backend
      export DOCKER_REGISTRY=mx-queretaro-1.ocir.io
      export OCI_REGION=mx-queretaro-1
      export TODO_PDB_NAME=${TODO_PDB_NAME}
      export UI_USERNAME=${UI_USERNAME}
      # Create deployment YAML
      export CURRENTTIME=$(date '+%F_%H:%M:%S')
      cp src/main/resources/todolistapp-springboot.yaml todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%DOCKER_REGISTRY%|${DOCKER_REGISTRY}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%TODO_PDB_NAME%|${TODO_PDB_NAME}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%OCI_REGION%|${OCI_REGION}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%UI_USERNAME%|${UI_USERNAME}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      # Apply the deployment
      kubectl apply -f todolistapp-springboot-${CURRENTTIME}.yaml -n mtdrworkshop



