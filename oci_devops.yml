version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm22-ee-java17
    TODO_PDB_NAME: telegrambotl46xj
    REGION: mx-queretaro-1
    UI_USERNAME: admin
    DOCKER_USERNAME: axixsctxuqtl/a01637441@tec.mx
    DOCKER_PASSWORD: x6Lx61Y(Md_uTTvO(kVa
    DOCKER_REGISTRY: mx-queretaro-1.ocir.io/axixsctxuqtl/telegrambot/l46xj
    OCI_REGION: mx-queretaro-1
    TENANCY_NAME: axixsctxuqtl

  exportedVariables:
    - DOCKER_USERNAME
    - DOCKER_PASSWORD
    - TODO_PDB_NAME
    - REGION
    - UI_USERNAME
    - DOCKER_REGISTRY
    - OCI_REGION
    - TENANCY_NAME

steps:
  - type: Command
    name: "Install dependencies"
    command: |
      yum -y install graalvm22-ee-17-native-image
      export PATH=$JAVA_HOME/bin:$PATH
      curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      curl -sL https://rpm.nodesource.com/setup_16.x | bash -
      yum install -y nodejs
      wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
      chmod +x /usr/local/bin/yq

  - type: Command
    name: "Docker Login"
    command: |
      echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin ${DOCKER_REGISTRY}

  - type: Command
    name: "Build Java App and Docker Image"
    command: |
      cd MtdrSpring/backend
      mvn clean package spring-boot:repackage -DskipTests
      docker build -t ${DOCKER_REGISTRY}/todolistapp-springboot:0.1 .
      docker push ${DOCKER_REGISTRY}/todolistapp-springboot:0.1

  - type: Command
    name: "Render Kubernetes YAML"
    command: |
      export CURRENTTIME=$(date '+%F_%H-%M-%S')
      export BUILD_TIMESTAMP=$(date +%s)
      cp MtdrSpring/backend/src/main/resources/todolistapp-springboot.yaml todolistapp-springboot-${CURRENTTIME}.yaml

      sed -i "s|%DOCKER_REGISTRY%|${DOCKER_REGISTRY}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%UI_USERNAME%|${UI_USERNAME}|g" todolistapp-springboot-${CURRENTTIME}.yaml
      sed -i "s|%OCI_REGION%|${OCI_REGION}|g" todolistapp-springboot-${CURRENTTIME}.yaml

      yq e '
        (.spec.template.metadata.annotations."build.timestamp") = strenv(BUILD_TIMESTAMP)
        | (.spec.template.spec.containers[].imagePullPolicy) = "Always"
      ' -i todolistapp-springboot-${CURRENTTIME}.yaml

      mkdir -p artifacts
      cp todolistapp-springboot-${CURRENTTIME}.yaml artifacts/deployment.yaml

outputArtifacts:
  - name: deployment-manifest
    type: BINARY
    location: artifacts/deployment.yaml