version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm22-ee-java17

steps:
  - type: Command
    name: "Install dependencies"
    command: |
      yum -y install graalvm22-ee-17-native-image
      export PATH=$JAVA_HOME/bin:$PATH
      curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      curl -sL https://rpm.nodesource.com/setup_16.x | bash -
      yum install -y nodejs
      wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
      chmod +x /usr/local/bin/yq

  - type: Command
    name: "Docker Login"
    command: |
      echo "${docker_password}" | docker login -u "${docker_username}" --password-stdin ${docker_registry}

  - type: Command
    name: "Build Java App"
    command: |
      cd MtdrSpring/backend
      mvn clean package spring-boot:repackage -DskipTests -Dopenai.api.key=${OPENAI_API_KEY}

  - type: Command
    name: "Build Docker Image"
    command: |
      cd MtdrSpring/backend
      docker build -t ${docker_registry}/todolistapp-springboot:0.1 .
      docker push ${docker_registry}/todolistapp-springboot:0.1

  - type: Command
    name: "Render Kubernetes YAML"
    command: |
      export CURRENTTIME=$(date '+%F_%H-%M-%S')
      export BUILD_TIMESTAMP=$(date +%s)

      mkdir -p artifacts

      # Render Deployment YAML
      cp MtdrSpring/backend/src/main/resources/deployment.yaml artifacts/deployment.yaml

      sed -i "s|%docker_registry%|${docker_registry}|g" artifacts/deployment.yaml
      sed -i "s|%ui_username%|${ui_username}|g" artifacts/deployment.yaml
      sed -i "s|%region%|${region}|g" artifacts/deployment.yaml

      # Only patch the Deployment YAML
      yq e '
        (.spec.template.metadata.annotations."build.timestamp") = strenv(BUILD_TIMESTAMP)
        | (.spec.template.spec.containers[].imagePullPolicy) = "Always"
      ' -i artifacts/deployment.yaml

      # Copy Services as-is, no patching
      cp MtdrSpring/backend/src/main/resources/service.yaml artifacts/service.yaml
      cp MtdrSpring/backend/src/main/resources/router.yaml artifacts/router.yaml


outputArtifacts:
  - name: deployment-manifest
    type: BINARY
    location: artifacts/deployment.yaml
  - name: service-manifest
    type: BINARY
    location: artifacts/service.yaml
  - name: router-manifest
    type: BINARY
    location: artifacts/router.yaml
