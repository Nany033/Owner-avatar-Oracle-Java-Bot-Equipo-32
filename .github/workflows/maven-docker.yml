name: Maven Build and Docker Image

on:
  push:
    branches: [ CI/CD, testing]
  pull_request:
    branches: [JorgeArizpe, jess]

jobs:
  set-up:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11 (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Maven
      run: sudo apt-get install -y maven
      
    - name: Set up Node.js (for frontend build)
      uses: actions/setup-node@v4
      with:
        node-version: '18'  # Adjust

    - name: Build and start Spring Boot backend
      run: |
        cd MtdrSpring/backend
        mvn clean package -DskipTests
        nohup java -jar target/*.jar &

    - name: Wait for server to start
      run: |
        echo "Waiting for server to start..."
        sleep 20
        curl --fail http://localhost:8080 || (echo "Server failed to start" && exit 1)

    - name: Install Firefox and Geckodriver
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox
        GECKO_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
        wget "https://github.com/mozilla/geckodriver/releases/download/v$GECKO_VERSION/geckodriver-v$GECKO_VERSION-linux64.tar.gz"
        tar -xvzf geckodriver-v$GECKO_VERSION-linux64.tar.gz
        chmod +x geckodriver
        sudo mv geckodriver /usr/local/bin/

    - name: Start virtual display (Xvfb)
      run: |
        sudo apt-get install -y xvfb
        export DISPLAY=:99
        nohup Xvfb :99 -screen 0 1920x1080x24 &

    - name: Install Python + Selenium dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install selenium
        
  selenium-test:
    runs-on: ubuntu-latest
    needs: set-up

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Selenium Firefox tests
      env:
        DISPLAY: :99
      run: |
        cd MtdrSpring/backend/src/test
        python3 addTaskTest.py
        python3 completeTaskTest.py
        python3 kpiTeamViewTest.py
        python3 kpiVisualizationTest.py
        python3 pieChartTest.py
        python3 taskViewTes.py
        python3 updateUserListTest.py
        
  docker:
    runs-on: ubuntu-latest
    needs: selenium-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-java-app:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-java-app:latest
